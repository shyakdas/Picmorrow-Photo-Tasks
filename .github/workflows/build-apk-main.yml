name: Build - Signed Release AAB

on:
  push:
    branches:
      - main

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/*.toml') }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Verify keystore
        run: |
          ls -lh release.keystore
          keytool -list \
            -keystore release.keystore \
            -storetype PKCS12 \
            -storepass ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: Bundle signed release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease -x test -x connectedAndroidTest

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: picmorrow-signed-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
